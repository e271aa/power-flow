name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install librsvg
        run: brew install librsvg
      - name: Test
        run: swift test
      - name: Build the app
        run: ./build.sh
