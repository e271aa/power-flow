name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - name: Install librsvg
        run: brew install librsvg
      - name: Test
        run: swift test
      - name: Build the app and the disk image
        run: ./build.sh --dmg
